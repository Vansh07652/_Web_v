# Deploys the current MedMosa production site to GitHub Pages. The build runs
# validation before publishing and serves the `medmosa.org` custom domain.

name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Pages is already enabled for this repository and owns the MedMosa custom
      # domain, so configure the existing site without trying to create it.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: npm ci

      - name: Validate deployable source
        run: >-
          npm run typecheck &&
          npm test &&
          npm run build:books &&
          npm run validate:books &&
          npm run validate:source &&
          npm run validate:routes &&
          npm run check:links &&
          npm run check:assets &&
          npm run scan:secrets

      - name: Build production site
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
