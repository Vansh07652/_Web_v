name: Deploy source API Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/lib/sources/types.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-source-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Worker
        run: npm run build:worker

      - name: Explain missing deployment credential
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Worker verification passed; deployment skipped because CLOUDFLARE_API_TOKEN is not configured."

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b86eda67dd2f6ef00713650f5de462a5
          workingDirectory: .
          command: deploy --keep-vars
