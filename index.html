<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base id="app-base" href="/" />
    <script>
      if (location.hostname.endsWith(".github.io")) {
        var project = location.pathname.split("/").filter(Boolean)[0];
        if (project) document.getElementById("app-base").href = "/" + project + "/";
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#071a2c" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https:; connect-src 'self' https://api.medmosa.org https://*.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />

    <title>MedMosa — free medical learning, made clear</title>
    <meta
      name="description"
      content="Free, organised study material for pre-health students: college-level notes, plain-language explanations and thousands of practice questions with full answer rationales."
    />
    <link rel="canonical" href="https://medmosa.org/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MedMosa" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="MedMosa — free medical learning, made clear" />
    <meta
      property="og:description"
      content="One curriculum for every pre-health prerequisite: college-level notes, plain-language explanations and thousands of practice questions with full answer rationales."
    />
    <meta property="og:url" content="https://medmosa.org/" />
    <!-- Absolute URL: social crawlers reject relative Open Graph images. -->
    <meta property="og:image" content="https://medmosa.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MedMosa — free medical learning, made clear" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedMosa — free medical learning, made clear" />
    <meta
      name="twitter:description"
      content="One curriculum for every pre-health prerequisite: notes, plain-language explanations and practice questions with full rationales."
    />
    <meta name="twitter:image" content="https://medmosa.org/og.png" />

    <link rel="icon" type="image/png" href="favicon/favicon.png" />
    <link rel="apple-touch-icon" href="favicon/favicon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!--
      The organisation node only. Per-page WebSite and
      BreadcrumbList markup is added at run time by src/lib/structured-data.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "MedMosa",
        "slogan": "Every prerequisite, connected.",
        "url": "https://medmosa.org/",
        "description": "Open learning for the health-care path ahead. A free educational resource for pre-health students: college-level notes, plain-language explanations and practice questions with full answer rationales, developed from open educational resources, peer-reviewed research and publicly available academic references. MedMosa is not a medical provider and does not provide personal medical advice.",
        "audience": {
          "@type": "EducationalAudience",
          "educationalRole": "student",
          "audienceType": "Pre-health college students"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
